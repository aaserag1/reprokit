name: ReproKit bug report
description: Report a problem with ReproKit without including private project data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include access tokens, `.env` values, private remote URLs, or proprietary logs. ReproKit reports must be reviewed before sharing.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Give a short description of the unexpected result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal steps to reproduce
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: bundle
    attributes:
      label: Sanitized ReproKit output
      description: Paste only a report you have reviewed, or describe why it cannot be shared.
